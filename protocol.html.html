<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벡스코 행사 의전서열 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow">
                    <i class="fa-solid fa-ranking-star text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">벡스코(BEXCO) 의전서열 시뮬레이터</h1>
                    <p class="text-xs text-slate-400">국가 의전서열 및 부산 지역 주요 기관장 맞춤형 행사 배치 툴</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="applyPreset('national')" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition">국가·정부 행사</button>
                <button onclick="applyPreset('busan')" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition">부산시 공식</button>
                <button onclick="applyPreset('economy')" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition">경제·상공인</button>
                <button onclick="resetData()" class="px-3 py-1.5 text-xs font-medium bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 rounded-lg border border-rose-800/50 transition"><i class="fa-solid fa-rotate-right mr-1"></i> 초기화</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow w-full">
        
        <!-- Left Panel: Available Pool / Database -->
        <section class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col h-[750px]">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-slate-900 text-base">기관 및 직위 데이터베이스</h2>
                    <span id="pool-count" class="px-2 py-0.5 text-xs font-semibold bg-blue-50 text-blue-600 rounded-full">0개</span>
                </div>
                <button onclick="openAddModal()" class="px-3 py-1.5 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> 직위/기관 추가
                </button>
            </div>

            <!-- Search & Filter -->
            <div class="flex gap-2 mb-3">
                <div class="relative flex-grow">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-xs text-slate-400"></i>
                    <input type="text" id="search-input" oninput="renderPool()" placeholder="기관명, 직위 또는 성함 검색..." class="w-full pl-8 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                </div>
                <select id="filter-category" onchange="renderPool()" class="px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                    <option value="all">전체 분류</option>
                    <option value="국가요인">국가요인</option>
                    <option value="입법사법">입법/사법/행정</option>
                    <option value="부산시">부산시/시의회</option>
                    <option value="사법경찰">경찰/검찰/군</option>
                    <option value="경제언론">상공회의소/경제</option>
                    <option value="금융기관">금융기관</option>
                    <option value="벡스코">주관(벡스코)</option>
                </select>
            </div>

            <!-- Pool List -->
            <div id="pool-list" class="overflow-y-auto flex-grow space-y-2 pr-1 custom-scrollbar">
                <!-- Dynamic Rendered -->
            </div>
            
            <div class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-400 flex justify-between items-center">
                <span><i class="fa-solid fa-info-circle mr-1"></i> 항목을 클릭하면 행사 배치 명단에 추가됩니다.</span>
            </div>
        </section>

        <!-- Right Panel: Event Protocol Order Table -->
        <section class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col h-[750px]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 pb-3 border-b border-slate-100">
                <div>
                    <h2 class="font-bold text-slate-900 text-base">행사 의전 배치 순서 (출석부)</h2>
                    <p class="text-xs text-slate-500">행사에 참석하는 내빈을 순서대로 배치하고 순번을 조정하세요.</p>
                </div>
                <div class="flex items-center gap-2 self-end sm:self-auto">
                    <button onclick="autoSortOrder()" class="px-3 py-1.5 text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg transition border border-emerald-200"><i class="fa-solid fa-arrow-down-1-9 mr-1"></i> 표준서열 자동정렬</button>
                    <button onclick="clearEventList()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg transition"><i class="fa-solid fa-trash-can mr-1"></i> 비우기</button>
                    <button onclick="copyEventList()" class="px-3 py-1.5 text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white rounded-lg transition shadow-sm"><i class="fa-solid fa-copy mr-1"></i> 결과 복사</button>
                </div>
            </div>

            <!-- Event List -->
            <div id="event-list" class="overflow-y-auto flex-grow space-y-2.5 pr-1 custom-scrollbar">
                <!-- Dynamic Rendered -->
            </div>

            <!-- Total Attendance Summary -->
            <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs font-medium text-slate-600">
                <span id="selected-count">총 참석 내빈: 0명</span>
                <span class="text-blue-600 font-semibold">벡스코 공식 의전 시뮬레이터 v2.0</span>
            </div>
        </section>

    </main>

    <!-- Modal for Adding/Editing Item -->
    <div id="item-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl border border-slate-100">
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 mb-4">새 기관/직위 추가</h3>
            <form id="item-form" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">분류</label>
                    <select id="modal-category" required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                        <option value="국가요인">국가요인</option>
                        <option value="입법사법">입법/사법/행정</option>
                        <option value="부산시">부산시/시의회</option>
                        <option value="사법경찰">경찰/검찰/군</option>
                        <option value="경제언론">상공회의소/경제</option>
                        <option value="금융기관">금융기관</option>
                        <option value="벡스코">주관(벡스코)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">기본 의전 서열번호 (숫자가 낮을수록 상위)</label>
                    <input type="number" id="modal-rank" required min="1" max="999" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" placeholder="예: 5">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">기관명 (소속)</label>
                    <input type="text" id="modal-org" required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" placeholder="예: 부산광역시">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">직위명 (직책)</label>
                    <input type="text" id="modal-title-input" required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" placeholder="예: 부산광역시장">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">성함 (필수 아님, 필요시 입력)</label>
                    <input type="text" id="modal-name" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" placeholder="예: 홍길동">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition">취소</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition shadow-sm">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        // Default Database without hardcoded names
        const defaultPool = [
            { id: '1', rank: 1, category: '국가요인', org: '대한민국', title: '대통령', name: '' },
            { id: '2', rank: 2, category: '국가요인', org: '국회', title: '국회의장', name: '' },
            { id: '3', rank: 3, category: '국가요인', org: '대법원', title: '대법원장', name: '' },
            { id: '4', rank: 4, category: '국가요인', org: '헌법재판소', title: '헌법재판소장', name: '' },
            { id: '5', rank: 5, category: '국가요인', org: '대한민국 정부', title: '국무총리', name: '' },
            { id: '6', rank: 10, category: '입법사법', org: '국회', title: '국회의원', name: '' },
            { id: '7', rank: 15, category: '부산시', org: '부산광역시', title: '부산광역시장', name: '' },
            { id: '8', rank: 16, category: '부산시', org: '부산광역시의회', title: '부산시의회 의장', name: '' },
            { id: '9', rank: 17, category: '부산시', org: '부산광역시교육청', title: '부산광역시 교육감', name: '' },
            { id: '10', rank: 20, category: '사법경찰', org: '부산경찰청', title: '부산경찰청장', name: '' },
            { id: '11', rank: 21, category: '사법경찰', org: '부산고등검찰청', title: '부산고등검사장', name: '' },
            { id: '12', rank: 22, category: '사법경찰', org: '부산지방법원', title: '부산지방법원장', name: '' },
            { id: '13', rank: 23, category: '사법경찰', org: '제53보병사단', title: '제53보병사단장', name: '' },
            { id: '14', rank: 30, category: '경제언론', org: '부산상공회의소', title: '부산상공회의소 회장', name: '' },
            { id: '15', rank: 35, category: '금융기관', org: 'BNK금융그룹', title: 'BNK금융그룹 회장', name: '' },
            { id: '16', rank: 40, category: '벡스코', org: '벡스코(BEXCO)', title: '대표이사 사장', name: '' },
            { id: '17', rank: 41, category: '벡스코', org: '벡스코(BEXCO)', title: '상임감사', name: '' },
            { id: '18', rank: 42, category: '벡스코', org: '벡스코(BEXCO)', title: '경영본부장 / 마케팅본부장', name: '' }
        ];

        let pool = JSON.parse(localStorage.getItem('bexco_protocol_pool')) || defaultPool;
        let eventList = JSON.parse(localStorage.getItem('bexco_protocol_event')) || [];

        function saveData() {
            localStorage.setItem('bexco_protocol_pool', JSON.stringify(pool));
            localStorage.setItem('bexco_protocol_event', JSON.stringify(eventList));
        }

        function renderPool() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('filter-category').value;
            const container = document.getElementById('pool-list');
            
            container.innerHTML = '';
            
            const filtered = pool.filter(item => {
                const matchesQuery = item.org.toLowerCase().includes(query) || item.title.toLowerCase().includes(query) || (item.name && item.name.toLowerCase().includes(query));
                const matchesCategory = category === 'all' || item.category === category;
                return matchesQuery && matchesCategory;
            });

            document.getElementById('pool-count').innerText = `${filtered.length}개`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">검색된 기관/직위가 없습니다.</div>`;
                return;
            }

            filtered.sort((a, b) => a.rank - b.rank);

            filtered.forEach(item => {
                const isSelected = eventList.some(e => e.id === item.id);
                const el = document.createElement('div');
                el.className = `p-3 rounded-xl border transition flex items-center justify-between cursor-pointer ${isSelected ? 'bg-slate-100 border-slate-300 opacity-60' : 'bg-slate-50 hover:bg-blue-50/50 border-slate-200 hover:border-blue-200'}`;
                el.onclick = () => { if (!isSelected) addToEvent(item.id); };

                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-slate-600 text-xs font-bold flex items-center justify-center shadow-2xs">${item.rank}</span>
                        <div>
                            <div class="text-xs font-bold text-slate-800">${item.org} <span class="font-normal text-slate-600">${item.title}</span></div>
                            <div class="text-[11px] text-blue-600 mt-0.5">${item.name ? '성함: ' + item.name : '성함 미입력'}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                        <a href="https://search.naver.com/search.naver?query=${encodeURIComponent(item.org + ' ' + item.title)}" target="_blank" title="네이버 인물 검색" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-white rounded-lg transition"><i class="fa-solid fa-magnifying-glass text-xs"></i></a>
                        <button onclick="editItem('${item.id}')" title="수정" class="p-1.5 text-slate-400 hover:text-amber-600 hover:bg-white rounded-lg transition"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteItem('${item.id}')" title="삭제" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-white rounded-lg transition"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderEventList() {
            const container = document.getElementById('event-list');
            container.innerHTML = '';
            document.getElementById('selected-count').innerText = `총 참석 내빈: ${eventList.length}명`;

            if (eventList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl flex flex-col items-center justify-center gap-2">
                        <i class="fa-solid fa-user-plus text-2xl text-slate-300"></i>
                        <p class="text-xs">왼쪽 목록에서 기관/직위를 클릭하여 행사 의전 순서에 배치하세요.</p>
                    </div>`;
                return;
            }

            eventList.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'p-3 rounded-xl border border-slate-200 bg-white shadow-2xs flex items-center justify-between gap-3';
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-lg bg-blue-600 text-white text-xs font-bold flex items-center justify-center shadow-sm">${index + 1}</span>
                        <div>
                            <div class="text-xs font-bold text-slate-900">${item.org} <span class="font-semibold text-slate-700">${item.title}</span></div>
                            <div class="text-[11px] text-slate-500">${item.name ? '성함: ' + item.name : '성함 미입력'}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="moveEvent(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="p-1.5 text-slate-400 hover:text-blue-600 disabled:opacity-20 rounded-lg"><i class="fa-solid fa-chevron-up text-xs"></i></button>
                        <button onclick="moveEvent(${index}, 1)" ${index === eventList.length - 1 ? 'disabled' : ''} class="p-1.5 text-slate-400 hover:text-blue-600 disabled:opacity-20 rounded-lg"><i class="fa-solid fa-chevron-down text-xs"></i></button>
                        <button onclick="removeFromEvent(${index})" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg ml-1"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>
                `;
                container.appendChild(el);
            });
            saveData();
        }

        function addToEvent(id) {
            const item = pool.find(i => i.id === id);
            if (item && !eventList.some(e => e.id === id)) {
                eventList.push({ ...item });
                renderEventList();
                renderPool();
            }
        }

        function removeFromEvent(index) {
            eventList.splice(index, 1);
            renderEventList();
            renderPool();
        }

        function moveEvent(index, direction) {
            const target = index + direction;
            if (target < 0 || target >= eventList.length) return;
            const temp = eventList[index];
            eventList[index] = eventList[target];
            eventList[target] = temp;
            renderEventList();
        }

        function autoSortOrder() {
            eventList.sort((a, b) => a.rank - b.rank);
            renderEventList();
        }

        function clearEventList() {
            if (confirm('현재 배치된 의전 명단을 모두 비우시겠습니까?')) {
                eventList = [];
                renderEventList();
                renderPool();
            }
        }

        function copyEventList() {
            if (eventList.length === 0) {
                alert('복사할 의전 명단이 없습니다.');
                return;
            }
            let text = '[벡스코 행사 의전 서열 배치표]\n';
            eventList.forEach((item, i) => {
                text += `${i + 1}. ${item.org} ${item.title} ${item.name ? '(' + item.name + ')' : ''}\n`;
            });
            navigator.clipboard.writeText(text).then(() => {
                alert('의전 배치표가 클립보드에 복사되었습니다!');
            });
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = '새 기관/직위 추가';
            document.getElementById('item-id').value = '';
            document.getElementById('modal-category').value = '부산시';
            document.getElementById('modal-rank').value = pool.length + 1;
            document.getElementById('modal-org').value = '';
            document.getElementById('modal-title-input').value = '';
            document.getElementById('modal-name').value = '';
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function editItem(id) {
            const item = pool.find(i => i.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = '기관/직위 수정';
            document.getElementById('item-id').value = item.id;
            document.getElementById('modal-category').value = item.category;
            document.getElementById('modal-rank').value = item.rank;
            document.getElementById('modal-org').value = item.org;
            document.getElementById('modal-title-input').value = item.title;
            document.getElementById('modal-name').value = item.name || '';
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const category = document.getElementById('modal-category').value;
            const rank = parseInt(document.getElementById('modal-rank').value);
            const org = document.getElementById('modal-org').value;
            const title = document.getElementById('modal-title-input').value;
            const name = document.getElementById('modal-name').value;

            if (id) {
                const item = pool.find(i => i.id === id);
                if (item) {
                    item.category = category;
                    item.rank = rank;
                    item.org = org;
                    item.title = title;
                    item.name = name;
                }
                // eventList에도 동기화
                const eventItem = eventList.find(i => i.id === id);
                if (eventItem) {
                    eventItem.category = category;
                    eventItem.rank = rank;
                    eventItem.org = org;
                    eventItem.title = title;
                    eventItem.name = name;
                }
            } else {
                const newItem = {
                    id: Date.now().toString(),
                    rank, category, org, title, name
                };
                pool.push(newItem);
            }

            saveData();
            renderPool();
            renderEventList();
            closeModal();
        }

        function deleteItem(id) {
            if (confirm('해당 기관/직위를 데이터베이스에서 삭제하시겠습니까?')) {
                pool = pool.filter(i => i.id !== id);
                eventList = eventList.filter(i => i.id !== id);
                saveData();
                renderPool();
                renderEventList();
            }
        }

        function applyPreset(type) {
            if (type === 'national') {
                eventList = pool.filter(i => ['국가요인', '입법사법', '벡스코'].includes(i.category));
            } else if (type === 'busan') {
                eventList = pool.filter(i => ['부산시', '사법경찰', '벡스코'].includes(i.category));
            } else if (type === 'economy') {
                eventList = pool.filter(i => ['부산시', '경제언론', '금융기관', '벡스코'].includes(i.category));
            }
            eventList.sort((a, b) => a.rank - b.rank);
            renderEventList();
            renderPool();
        }

        function resetData() {
            if (confirm('데이터를 초기 기본값으로 되돌리시겠습니까?')) {
                pool = [...defaultPool];
                eventList = [];
                saveData();
                renderPool();
                renderEventList();
            }
        }

        // Initialize
        renderPool();
        renderEventList();
    </script>
</body>
</html>
